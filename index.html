<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Alô, Professor</title>
  <style>
    :root { --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f27; --muted: #5d6675; --line: #e2e5ea;
      --err: #b3261e; --warn: #8a5a00; --warn-bg: #fdf0d0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151b; --card: #1b2029; --ink: #e8ebf0; --muted: #9aa3b2; --line: #2b3240;
        --err: #ff9d96; --warn: #f0c36a; --warn-bg: #3a2f12; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    [hidden] { display: none !important; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      max-width: 380px; width: 100%; text-align: center; padding: 28px 20px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: .9rem; }
    #botaoGoogle { display: flex; justify-content: center; margin: 22px 0 8px; min-height: 44px; }
    .rodape { margin-top: 24px; color: var(--muted); font-size: .8rem; }
    #erro { color: var(--err); font-size: .92rem; min-height: 1.4em; margin-top: 8px; }
    #configAviso { text-align: left; background: var(--warn-bg); color: var(--warn);
      border-radius: 8px; padding: 12px; margin-top: 16px; font-size: .92rem; }
  </style>
</head>
<body>
  <!-- Página pública: só o login do Google. O painel de verdade fica no Apps Script
       (privado) e só é entregue depois de o servidor conferir o seu login. -->
  <main>
    <div class="card">
      <h1>Alô, Professor</h1>
      <p id="sub" class="muted">A telefonista que liga para lembrar você. Entre com a sua conta Google.</p>
      <div id="botaoGoogle"></div>
      <p id="erro" role="alert"></p>
      <div id="configAviso" hidden>
        <strong>Falta configurar.</strong> Edite o arquivo <code>config.js</code> e preencha
        <code>GOOGLE_CLIENT_ID</code> e <code>API_URL</code>.
      </div>
      <p class="rodape">Alô, Professor · Rosival D. Silva · 2026</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
  (function () {
    'use strict';
    var CFG = window.TELEFONISTA || {};
    var tentativas = 0;
    var carregando = false;
    var trocado = false; // true depois que o painel substituiu esta página

    function $(id) { return document.getElementById(id); }

    function configurado() {
      return !!(CFG.GOOGLE_CLIENT_ID && CFG.API_URL &&
        CFG.GOOGLE_CLIENT_ID.indexOf('COLE_') !== 0 && CFG.API_URL.indexOf('COLE_') !== 0);
    }

    function expiracao(t) {
      try {
        var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(b)).exp * 1000;
      } catch (e) { return 0; }
    }

    function guardar(t) {
      try { if (t) sessionStorage.setItem('tel_token', t); else sessionStorage.removeItem('tel_token'); } catch (e) {}
    }

    function falha(msg) {
      carregando = false;
      guardar('');
      $('botaoGoogle').hidden = false;
      $('sub').hidden = false;
      $('erro').textContent = msg;
    }

    // Pede o painel ao servidor. Ele só responde se o token for do e-mail autorizado.
    function carregar(token) {
      if (carregando) return;
      if (expiracao(token) < Date.now() + 60000) { falha('Sessão expirada. Entre de novo.'); return; }
      carregando = true;
      $('erro').textContent = '';
      $('sub').textContent = 'Carregando o painel…';
      fetch(CFG.API_URL, {
        method: 'POST', redirect: 'follow',
        body: JSON.stringify({ acao: 'painel', idToken: token })
      })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.erro || 'Erro desconhecido.');
          guardar(token); // o painel reaproveita o login
          trocado = true;
          document.open();
          document.write(j.html);
          document.close();
        })
        .catch(function (e) {
          $('sub').textContent = 'A telefonista que liga para lembrar você. Entre com a sua conta Google.';
          falha(e && e.message && e.message.indexOf('fetch') < 0 ? e.message :
            'Não consegui falar com o servidor. Confira a API_URL em config.js.');
        });
    }

    function prepararGoogle() {
      if (trocado) return;
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: CFG.GOOGLE_CLIENT_ID,
          callback: function (r) { carregar(r.credential); },
          auto_select: false
        });
        google.accounts.id.renderButton($('botaoGoogle'), {
          theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'pt-BR', width: 280
        });
        return;
      }
      if (++tentativas > 50) {
        $('erro').textContent = 'Não consegui carregar o login do Google. Algum bloqueador de conteúdo pode estar impedindo.';
        return;
      }
      setTimeout(prepararGoogle, 200);
    }

    if (!configurado()) {
      $('configAviso').hidden = false;
      $('botaoGoogle').hidden = true;
      return;
    }
    var guardado = '';
    try { guardado = sessionStorage.getItem('tel_token') || ''; } catch (e) {}
    if (guardado) carregar(guardado);
    prepararGoogle();
  })();
  </script>
</body>
</html>
